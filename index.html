<style>

  #statusbar{font-size:11px;font-weight:700;text-align:center;padding:6px;display:flex;align-items:center;justify-content:center;gap:6px}
  #statusbar.offline{background:#22c55e;color:#fff}
  #statusbar.online{background:#1e293b;color:#fff}
  header{background:#4338ca;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  header h1{font-size:20px;font-weight:900;letter-spacing:-.5px}
  #tabBtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer}
  /* POS 화면 */
  #posView,#historyView{flex:1;overflow-y:auto;padding:16px;padding-bottom:200px}
  #historyView{padding-bottom:40px}
  .card{background:#fff;border-radius:24px;padding:24px;border:1px solid #e2e8f0;margin-bottom:16px}
  #scanBtn{width:100%;background:#4338ca;color:#fff;border:none;border-radius:16px;padding:28px;font-size:22px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .1s}
  #scanBtn:active{transform:scale(.97)}
  #scanBtn svg{width:40px;height:40px}
  .manual-row{display:flex;gap:8px;margin-top:16px}
  .manual-row input{flex:1;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;outline:none}
  .manual-row input:focus{border-color:#4338ca}
  .manual-row button{background:#1e293b;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:900;font-size:15px;cursor:pointer}
  .section-label{font-size:11px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;padding:0 4px;margin-bottom:10px}
  .empty-cart{padding:60px 0;text-align:center;color:#cbd5e1}
  .empty-cart svg{width:40px;height:40px;margin:0 auto 8px;opacity:.3;display:block}
  .cart-item{background:#fff;border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:space-between;border:1px solid #f1f5f9;margin-bottom:10px}
  .cart-item-info{flex:1;margin-right:12px}
  .cart-item-series{font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:2px}
  .cart-item-title{font-size:16px;font-weight:700;color:#1e293b;line-height:1.3;margin-bottom:4px}
  .cart-item-price{font-size:18px;font-weight:900;color:#4338ca}
  .qty-row{display:flex;align-items:center;gap:6px}
  .qty-box{display:flex;align-items:center;background:#f1f5f9;border-radius:12px;padding:4px}
  .qty-box button{width:38px;height:38px;background:#fff;border:none;border-radius:8px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .qty-box span{width:30px;text-align:center;font-size:18px;font-weight:900}
  .del-btn{background:none;border:none;color:#f87171;padding:10px;cursor:pointer}
  .del-btn svg{width:22px;height:22px}
  /* 하단 결제바 */
  #checkoutBar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;padding:20px;border-top:2px solid #f1f5f9;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.07)}
  .total-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;padding:0 4px}
  .total-label{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase}
  .total-amount{font-size:36px;font-weight:900;color:#4338ca}
  .total-amount span{font-size:18px;margin-left:2px}
  .pay-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pay-btn{border:none;color:#fff;padding:18px;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;transition:transform .1s}
  .pay-btn:active{transform:scale(.97)}
  .pay-btn:disabled{background:#e2e8f0!important;color:#94a3b8;cursor:not-allowed}
  .pay-btn.cash{background:#10b981}
  .pay-btn.transfer{background:#2563eb}
  /* 판매 기록 */
  .history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .history-header h2{font-size:22px;font-weight:900;color:#1e293b}
  #exportBtn{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid #e0e7ff;color:#4338ca;padding:8px 14px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer}
  #exportBtn svg{width:16px;height:16px}
  .summary-card{background:#4338ca;border-radius:24px;padding:24px;color:#fff;margin-bottom:16px}
  .summary-card .sub{font-size:10px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
  .summary-card .big{font-size:36px;font-weight:900;margin-bottom:16px}
  .summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
  .summary-stats .stat-label{font-size:10px;color:#a5b4fc;font-weight:700}
  .summary-stats .stat-val{font-size:18px;font-weight:700}
  .record-card{background:#fff;border-radius:16px;padding:18px;border:1px solid #e2e8f0;margin-bottom:10px}
  .record-meta{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:6px}
  .record-method{padding:2px 8px;border-radius:6px}
  .record-method.cash{background:#f0fdf4;color:#16a34a}
  .record-method.transfer{background:#eff6ff;color:#2563eb}
  .record-items{font-weight:700;color:#1e293b;margin-bottom:6px;line-height:1.4}
  .record-total{text-align:right;font-size:18px;font-weight:900;color:#312e81}
  #clearBtn{width:100%;padding:24px;color:#cbd5e1;font-size:12px;font-weight:700;background:none;border:none;cursor:pointer;margin-top:8px}

  #scannerOverlay.active{display:flex}
  .scanner-top{padding:20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}
  .scanner-badge{background:rgba(34,197,94,.8);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:8px}
  #closeScanBtn{background:#ef4444;color:#fff;border:none;padding:8px 18px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
  #reader{width:100%;flex:1}
  .scan-guide{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .scan-frame{width:288px;height:160px;border:2px solid rgba(255,255,255,.5);border-radius:24px;position:relative;overflow:hidden}
  .scan-line{position:absolute;top:50%;left:10%;width:80%;height:2px;background:#22c55e;box-shadow:0 0 15px #22c55e;animation:scan 1.5s infinite ease-in-out}
  @keyframes scan{0%,100%{transform:translateY(-50px);opacity:.2}50%{transform:translateY(50px);opacity:1}}
  .scan-hint{margin-top:28px;background:rgba(0,0,0,.6);color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700}

<div id="app">
  <div id="statusbar" class="online">🌐 온라인 상태</div>
  <header>
    <h1>📚 도서 POS</h1>
    <button id="tabBtn">판매기록 보기</button>

  <!-- POS 화면 -->

    <div class="card">

        스캔 시작
      </button>
      <div class="manual-row">
        <input type="number" id="manualInput" placeholder="바코드 숫자 직접 입력">
        <button onclick="addByManual()">추가</button>
      </div>
    </div>
    <div class="section-label">장바구니 리스트</div>
    <div id="cartList">
      <div class="empty-cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        목록이 비어있습니다
      </div>
    </div>
  </div>

  <!-- 판매기록 화면 -->
  <div id="historyView" style="display:none">
    <div class="history-header">
      <h2>판매 기록</h2>
      <button id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        엑셀 저장
      </button>
    </div>
    <div class="summary-card">
      <div class="sub">기기 누적 매출액</div>
      <div class="big" id="totalRevenue">0원</div>
      <div class="summary-stats">
        <div><div class="stat-label">판매 건수</div><div class="stat-val" id="totalCount">0건</div></div>
      </div>
    </div>
    <div id="recordList"></div>
    <button id="clearBtn">기기 데이터 완전 삭제</button>
  </div>

  <!-- 하단 결제바 -->
  <div id="checkoutBar">
    <div class="total-row">
      <div class="total-label">총 결제 금액</div>
      <div class="total-amount"><span id="totalPrice">0</span><span>원</span></div>
    </div>
    <div class="pay-btns">
      <button class="pay-btn cash" id="cashBtn" onclick="checkout('현금')">현금 결제</button>
      <button class="pay-btn transfer" id="transferBtn" onclick="checkout('계좌이체')">계좌 이체</button>
    </div>
  </div>

  <!-- 스캐너 오버레이 -->
  <div id="scannerOverlay">
    <div class="scanner-top">
      <span class="scanner-badge">바코드를 비춰주세요</span>
      <button id="closeScanBtn">닫기</button>
    </div>
    <div style="position:relative;flex:1">
      <div id="reader"></div>
      <div class="scan-guide">
        <div class="scan-frame"><div class="scan-line"></div></div>
        <div class="scan-hint">바코드를 사각형 안에 맞춰주세요</div>
      </div>
    </div>
  </div>
</div>

// ── 상태 ──────────────────────────────────────────
let cart = [];
let salesHistory = JSON.parse(localStorage.getItem('pos_sales') || '[]');
let scanner = null;
let currentView = 'pos';

// ── 오프라인 감지 ─────────────────────────────────
function updateStatus() {
  const bar = document.getElementById('statusbar');
  if (navigator.onLine) {
    bar.className = 'online';
    bar.textContent = '🌐 온라인 상태';
  } else {
    bar.className = 'offline';
    bar.textContent = '📴 오프라인 모드 안전하게 작동 중';
  }
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();

// ── 탭 전환 ──────────────────────────────────────
document.getElementById('tabBtn').addEventListener('click', () => {
  currentView = currentView === 'pos' ? 'history' : 'pos';
  document.getElementById('posView').style.display = currentView === 'pos' ? '' : 'none';
  document.getElementById('historyView').style.display = currentView === 'history' ? '' : 'none';
  document.getElementById('checkoutBar').style.display = currentView === 'pos' ? '' : 'none';
  document.getElementById('tabBtn').textContent = currentView === 'pos' ? '판매기록 보기' : '계산대로 이동';
  if (currentView === 'history') renderHistory();
});

// ── 스캐너 ────────────────────────────────────────
document.getElementById('scanBtn').addEventListener('click', startScanner);
document.getElementById('closeScanBtn').addEventListener('click', stopScanner);

async function startScanner() {
  document.getElementById('scannerOverlay').classList.add('active');
  await new Promise(r => setTimeout(r, 300));
  scanner = new Html5Qrcode('reader');
  try {
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 15, qrbox: { width: 280, height: 160 }, experimentalFeatures: { useBarCodeDetectorIfSupported: true } },
      (code) => { if (navigator.vibrate) navigator.vibrate(100); addToCart(code); stopScanner(); },
      () => {}
    );
    // 줌 시도 (지원 기기만)
    try {
      const caps = scanner.getRunningTrackCameraCapabilities && scanner.getRunningTrackCameraCapabilities();
      if (caps && caps.zoomFeature && caps.zoomFeature().isSupported()) caps.zoomFeature().apply(2.0);
    } catch(e) {}
  } catch(e) {
    alert('카메라 권한을 허용해 주세요.');
    stopScanner();
  }
}

async function stopScanner() {
  document.getElementById('scannerOverlay').classList.remove('active');
  if (scanner) {
    try { if (scanner.isScanning) await scanner.stop(); } catch(e) {}
    try { scanner.clear(); } catch(e) {}
    scanner = null;
  }
}

// ── 장바구니 ─────────────────────────────────────
function addToCart(barcode) {
  const code = String(barcode || '').trim();
  if (!code) return;
  const book = BOOK_DATABASE.find(b => b.barcode === code);
  if (!book) { alert('미등록 바코드: ' + code); document.getElementById('manualInput').value = ''; return; }
  const existing = cart.find(i => i.barcode === code);
  if (existing) existing.qty++;
  else cart.push({ ...book, qty: 1 });
  document.getElementById('manualInput').value = '';
  renderCart();
}

function addByManual() { addToCart(document.getElementById('manualInput').value); }

function updateQty(barcode, delta) {
  const item = cart.find(i => i.barcode === barcode);
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  renderCart();
}

function removeItem(barcode) {
  cart = cart.filter(i => i.barcode !== barcode);
  renderCart();
}

function renderCart() {
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById('totalPrice').textContent = total.toLocaleString();
  const disabled = cart.length === 0;
  document.getElementById('cashBtn').disabled = disabled;
  document.getElementById('transferBtn').disabled = disabled;

  const el = document.getElementById('cartList');
  if (cart.length === 0) {
    el.innerHTML = '<div class="empty-cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>목록이 비어있습니다</div>';
    return;
  }
  el.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-series">${item.series}</div>
        <div class="cart-item-title">${item.title}</div>
        <div class="cart-item-price">${item.price.toLocaleString()}원</div>
      </div>
      <div class="qty-row">
        <div class="qty-box">
          <button onclick="updateQty('${item.barcode}',-1)">-</button>
          <span>${item.qty}</span>
          <button onclick="updateQty('${item.barcode}',1)">+</button>
        </div>
        <button class="del-btn" onclick="removeItem('${item.barcode}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </button>
      </div>
    </div>`).join('');
}

// ── 결제 ──────────────────────────────────────────
function checkout(method) {
  if (cart.length === 0) return;
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  salesHistory.unshift({
    id: Date.now(),
    timestamp: new Date().toLocaleString('ko-KR'),
    items: cart.map(i => `${i.title}(${i.qty})`).join(', '),
    cartSnapshot: cart.map(i => ({ series: i.series, title: i.title, qty: i.qty, price: i.price })),
    total, method
  });
  localStorage.setItem('pos_sales', JSON.stringify(salesHistory));
  cart = [];
  renderCart();
}

// ── 판매기록 ─────────────────────────────────────
function renderHistory() {
  const totalRev = salesHistory.reduce((s, r) => s + r.total, 0);
  document.getElementById('totalRevenue').textContent = totalRev.toLocaleString() + '원';
  document.getElementById('totalCount').textContent = salesHistory.length + '건';
  document.getElementById('recordList').innerHTML = salesHistory.map(r => `
    <div class="record-card">
      <div class="record-meta">
        <span>${r.timestamp}</span>
        <span class="record-method ${r.method === '현금' ? 'cash' : 'transfer'}">${r.method}</span>
      </div>
      <div class="record-items">${r.items}</div>
      <div class="record-total">${r.total.toLocaleString()}원</div>
    </div>`).join('');
}

// ── 엑셀 저장 ─────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  if (salesHistory.length === 0) { alert('저장할 판매 기록이 없습니다.'); return; }
  const rows = [];
  salesHistory.forEach(r => {
    (r.cartSnapshot || []).forEach(b => {
      rows.push({ "날짜": r.timestamp, "시리즈": b.series || '', "책 이름": b.title, "수량": b.qty, "단가": b.price, "금액": b.price * b.qty, "결제수단": r.method });
    });
    if (!r.cartSnapshot || r.cartSnapshot.length === 0)
      rows.push({ "날짜": r.timestamp, "시리즈": '', "책 이름": r.items, "수량": '', "단가": '', "금액": r.total, "결제수단": r.method });
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:20},{wch:12},{wch:30},{wch:6},{wch:8},{wch:10},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '판매기록');
  XLSX.writeFile(wb, `도서판매_${new Date().toLocaleDateString('ko-KR').replace(/\./g,'').replace(/ /g,'')}.xlsx`);
});

// ── 데이터 삭제 ───────────────────────────────────
document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('이 기기의 모든 데이터를 지울까요?')) {
    salesHistory = [];
    localStorage.removeItem('pos_sales');
    renderHistory();
  }
});

// ── 초기 렌더 ─────────────────────────────────────
renderCart();
</script>
