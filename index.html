        function App() {
            const [view, setView] = useState('pos');
            const [cart, setCart] = useState([]);
            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            const [salesHistory, setSalesHistory] = useState(() => {
                const saved = localStorage.getItem('offline_pos_sales');
                return saved ? JSON.parse(saved) : [];
            });
            const [isScanning, setIsScanning] = useState(false);
            const [manualInput, setManualInput] = useState('');

            const html5QrCode = useRef(null);

            // 오프라인 상태 실시간 감지
            useEffect(() => {
                const handleOffline = () => setIsOffline(true);
                const handleOnline = () => setIsOffline(false);
                window.addEventListener('offline', handleOffline);
                window.addEventListener('online', handleOnline);
                return () => {
                    window.removeEventListener('offline', handleOffline);
                    window.removeEventListener('online', handleOnline);
                };
            }, []);

            // 판매 데이터가 변경될 때마다 기기에 로컬 저장 (오프라인의 핵심)
            useEffect(() => {
                localStorage.setItem('offline_pos_sales', JSON.stringify(salesHistory));
            }, [salesHistory]);

            // 아이콘 다시 그리기 (화면 전환 시)
            useEffect(() => {
                if (window.lucide) lucide.createIcons();
            }, [view, cart, salesHistory, isScanning, isOffline]);

            const startScanner = async () => {
                setIsScanning(true);
                setTimeout(async () => {
                    const scanner = new Html5Qrcode("reader");
                    html5QrCode.current = scanner;

                    // 표준 제약 조건만 사용 (호환성 향상)
                    const config = {
                        fps: 15,
                        qrbox: { width: 280, height: 160 },
                        aspectRatio: 1.0,
                        formatsToSupport: undefined,
                        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                    };

                    try {
                        await scanner.start(
                            { facingMode: "environment" },
                            config,
                            (decodedText) => {
                                if (navigator.vibrate) navigator.vibrate(100);
                                addToCart(decodedText);
                                stopScanner();
                            },
                            () => {}
                        );

                        // 줌 적용 (기기가 지원하는 경우에만, 안전하게 시도)
                        try {
                            const caps = scanner.getRunningTrackCameraCapabilities
                                ? scanner.getRunningTrackCameraCapabilities()
                                : null;
                            if (caps && caps.zoomFeature && caps.zoomFeature().isSupported()) {
                                caps.zoomFeature().apply(2.0);
                            }
                        } catch (zoomErr) {
                            // 줌 미지원 기기 — 무시하고 정상 스캔
                        }
                    } catch (err) {
                        alert("카메라를 켤 수 없습니다. 카메라 권한을 허용했는지 확인하세요.");
                        setIsScanning(false);
                    }
                }, 300);
            };

            const stopScanner = async () => {
                if (html5QrCode.current && html5QrCode.current.isScanning) {
                    try { await html5QrCode.current.stop(); } catch (err) {}
                }
                if (html5QrCode.current) {
                    try { html5QrCode.current.clear(); } catch (err) {}
                }
                setIsScanning(false);
            };

            const addToCart = (barcode) => {
                const clean = String(barcode || '').trim();
                if (!clean) return;
                const book = BOOK_DATABASE.find(b => b.barcode === clean);
                if (book) {
                    setCart(prev => {
                        const existing = prev.find(item => item.barcode === clean);
                        if (existing) return prev.map(item => item.barcode === clean ? { ...item, qty: item.qty + 1 } : item);
                        return [...prev, { ...book, qty: 1 }];
                    });
                } else {
                    alert("미등록 바코드: " + clean);
                }
                setManualInput('');
            };

            const updateQty = (barcode, delta) => {
                setCart(prev => prev.map(item => item.barcode === barcode ? { ...item, qty: Math.max(1, item.qty + delta) } : item));
            };

            const removeItem = (barcode) => setCart(prev => prev.filter(item => item.barcode !== barcode));

            const handleCheckout = (method) => {
                if (cart.length === 0) return;
                const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
                const itemsStr = cart.map(i => `${i.title}(${i.qty})`).join(", ");
                const newRecord = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString('ko-KR'),
                    items: itemsStr,
                    cartSnapshot: cart.map(i => ({ series: i.series, title: i.title, qty: i.qty, price: i.price })),
                    total,
                    method
                };
                setSalesHistory(prev => [newRecord, ...prev]);
                setCart([]);
            };

            // 진짜 엑셀(.xlsx) 파일로 저장 — 한 줄당 한 권씩 상세 기록
            const exportExcel = () => {
                if (salesHistory.length === 0) { alert("저장할 판매 기록이 없습니다."); return; }
                const rows = [];
                salesHistory.forEach(r => {
                    const list = r.cartSnapshot || [];
                    if (list.length > 0) {
                        list.forEach(b => {
                            rows.push({
                                "날짜": r.timestamp,
                                "시리즈": b.series || "",
                                "책 이름": b.title,
                                "수량": b.qty,
                                "단가": b.price,
                                "금액": b.price * b.qty,
                                "결제수단": r.method
                            });
                        });
                    } else {
                        rows.push({ "날짜": r.timestamp, "시리즈": "", "책 이름": r.items, "수량": "", "단가": "", "금액": r.total, "결제수단": r.method });
                    }
                });
                const ws = XLSX.utils.json_to_sheet(rows);
                ws['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 30 }, { wch: 6 }, { wch: 8 }, { wch: 10 }, { wch: 10 }];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "판매기록");
                const today = new Date().toLocaleDateString('ko-KR').replace(/\./g, '').replace(/\s/g, '');
                XLSX.writeFile(wb, `박람회_매출_${today}.xlsx`);
            };

            const totalPrice = cart.reduce((s, i) => s + (i.price * i.qty), 0);

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-100 shadow-2xl relative">
                    {isOffline ? (
                        <div className="bg-green-500 text-white text-xs font-bold text-center py-1.5 flex items-center justify-center gap-2">
                            <i data-lucide="wifi-off" className="w-3 h-3"></i>
                            오프라인 모드 안전하게 작동 중 (데이터 기기 저장)
                        </div>
                    ) : (
                        <div className="bg-slate-800 text-white text-xs font-bold text-center py-1.5 flex items-center justify-center gap-2">
                            <i data-lucide="wifi" className="w-3 h-3 text-green-400"></i>
                            온라인 상태
                        </div>
                    )}

                    <header className="bg-indigo-700 text-white p-5 flex justify-between items-center shrink-0 z-20 shadow-md">
                        <div className="flex items-center gap-2">
                            <i data-lucide="book" className="w-6 h-6"></i>
                            <h1 className="text-xl font-black tracking-tight">도서 POS</h1>
                        </div>
                        <button onClick={() => setView(view === 'pos' ? 'history' : 'pos')} className="bg-white/20 px-4 py-1.5 rounded-full text-xs font-bold uppercase">
                            {view === 'pos' ? '판매기록 보기' : '계산대로 이동'}
                        </button>
                    </header>

                    {view === 'pos' ? (
                        <>
                            <main className="flex-1 overflow-y-auto p-4 space-y-4 pb-48 no-scrollbar">
                                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                                    <button onClick={startScanner} className="w-full bg-indigo-600 active:bg-indigo-800 text-white py-8 rounded-2xl flex flex-col items-center gap-2 shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                                        <i data-lucide="scan" className="w-10 h-10"></i>
                                        <span className="text-2xl font-black">스캔 시작</span>
                                    </button>

                                    <div className="flex gap-2 pt-4">
                                        <input type="number" placeholder="바코드 숫자 직접 입력" value={manualInput} onChange={e=>setManualInput(e.target.value)} className="flex-1 bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-lg font-bold outline-none focus:border-indigo-500" />
                                        <button onClick={()=>addToCart(manualInput)} className="bg-slate-800 text-white px-6 rounded-xl font-black">추가</button>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <h2 className="text-[11px] font-black text-slate-400 uppercase tracking-widest px-2">장바구니 리스트</h2>
                                    {cart.length === 0 ? (
                                        <div className="py-16 text-center text-slate-300">
                                            <i data-lucide="shopping-bag" className="w-10 h-10 mx-auto mb-2 opacity-20"></i>
                                            <p className="font-bold">목록이 비어있습니다</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.barcode} className="bg-white p-5 rounded-2xl flex items-center justify-between shadow-sm border border-slate-100">
                                                <div className="flex-1 mr-4">
                                                    <p className="text-[11px] text-slate-400 font-bold mb-0.5">{item.series}</p>
                                                    <p className="font-bold text-slate-800 text-lg leading-tight mb-1">{item.title}</p>
                                                    <p className="text-indigo-600 font-black text-xl">{item.price.toLocaleString()}원</p>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <div className="flex items-center bg-slate-100 rounded-xl p-1">
                                                        <button onClick={()=>updateQty(item.barcode,-1)} className="w-10 h-10 font-black text-2xl bg-white rounded-lg shadow-sm">-</button>
                                                        <span className="w-8 text-center font-black text-xl">{item.qty}</span>
                                                        <button onClick={()=>updateQty(item.barcode,1)} className="w-10 h-10 font-black text-2xl bg-white rounded-lg shadow-sm">+</button>
                                                    </div>
                                                    <button onClick={()=>removeItem(item.barcode)} className="text-red-400 p-3"><i data-lucide="x-circle" className="w-6 h-6"></i></button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </main>

                            <div className="absolute bottom-0 left-0 right-0 bg-white p-6 border-t-2 border-slate-100 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] rounded-t-[2rem]">
                                <div className="flex justify-between items-end mb-4 px-1">
                                    <span className="text-slate-400 font-bold uppercase text-xs">총 결제 금액</span>
                                    <span className="text-4xl font-black text-indigo-700">{totalPrice.toLocaleString()}<span className="text-xl ml-1">원</span></span>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={()=>handleCheckout('현금')} disabled={cart.length===0} className="bg-emerald-500 active:bg-emerald-600 disabled:bg-slate-200 text-white py-5 rounded-2xl font-black text-xl shadow-lg shadow-emerald-100 active:scale-95 transition-all">현금 결제</button>
                                    <button onClick={()=>handleCheckout('계좌이체')} disabled={cart.length===0} className="bg-blue-600 active:bg-blue-700 disabled:bg-slate-200 text-white py-5 rounded-2xl font-black text-xl shadow-lg shadow-blue-100 active:scale-95 transition-all">계좌 이체</button>
                                </div>
                            </div>
                        </>
                    ) : (
                        <main className="flex-1 overflow-y-auto p-5 space-y-6 bg-slate-50">
                            <div className="flex justify-between items-center">
                                <h2 className="text-2xl font-black text-slate-800">로컬 판매 기록</h2>
                                <button onClick={exportExcel} className="flex items-center gap-1 text-indigo-600 font-black border-2 border-indigo-100 px-4 py-2 rounded-xl bg-white shadow-sm">
                                    <i data-lucide="download" className="w-4 h-4"></i>엑셀 저장
                                </button>
                            </div>

                            <div className="bg-indigo-700 p-6 rounded-3xl text-white shadow-xl shadow-indigo-200">
                                <p className="text-indigo-200 text-xs font-bold uppercase tracking-widest mb-1">기기 누적 매출액</p>
                                <p className="text-4xl font-black mb-4">{salesHistory.reduce((s,r)=>s+r.total,0).toLocaleString()}원</p>
                                <div className="grid grid-cols-2 gap-4 pt-4 border-t border-white/20">
                                    <div><p className="text-indigo-300 text-[10px] font-bold">판매 건수</p><p className="text-xl font-bold">{salesHistory.length}건</p></div>
                                </div>
                            </div>

                            <div className="space-y-3 pb-10">
                                {salesHistory.map(record => (
                                    <div key={record.id} className="p-5 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-2">
                                            <span>{record.timestamp}</span>
                                            <span className={`px-2 py-0.5 rounded-md ${record.method === '현금' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-blue-600'}`}>{record.method}</span>
                                        </div>
                                        <p className="font-bold text-slate-800 mb-1 leading-snug">{record.items}</p>
                                        <p className="text-right font-black text-xl text-indigo-900">{record.total.toLocaleString()}원</p>
                                    </div>
                                ))}
                            </div>
                            <button onClick={()=>{if(confirm("이 기기의 모든 데이터를 지울까요?")) setSalesHistory([]);}} className="w-full py-6 text-slate-300 text-xs font-bold">기기 데이터 완전 삭제</button>
                        </main>
                    )}

                    {isScanning && (
                        <div className="fixed inset-0 bg-black z-[100] flex flex-col">
                            <div className="p-5 flex justify-between items-center z-10 bg-gradient-to-b from-black/80 to-transparent">
                                <span className="text-white font-bold bg-green-500/80 px-3 py-1 rounded-lg text-xs">바코드를 비춰주세요</span>
                                <button onClick={stopScanner} className="bg-red-500 text-white px-5 py-2 rounded-xl font-bold">닫기</button>
                            </div>
                            <div className="flex-1 relative flex items-center justify-center bg-black overflow-hidden">
                                <div id="reader" className="w-full h-full scale-110"></div>
                                <div className="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
                                    <div className="w-72 h-40 border-2 border-white/50 rounded-3xl relative overflow-hidden">
                                        <div className="scan-line"></div>
                                    </div>
                                    <p className="mt-8 bg-black/60 text-white px-4 py-2 rounded-full text-xs font-bold">바코드를 사각형 안에 맞춰주세요</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        window.onload = () => { setInterval(() => { if (window.lucide) lucide.createIcons(); }, 800); };
    </script>
</body>
</html>
